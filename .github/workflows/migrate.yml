name: Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "已有手工迁移历史选 baseline；全新空库选 fresh；后续正常执行选 push"
        required: true
        default: push
        type: choice
        options:
          - push
          - baseline
          - fresh
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrate.yml"

permissions:
  contents: read

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || vars.SUPABASE_MIGRATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show remote migration history
        run: supabase migration list --linked

      - name: Baseline existing manual migrations
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'baseline'
        run: >-
          supabase migration repair
          --status applied
          --linked
          --yes
          0001 0002 0003 0004 0005 0006 0007 0008 0009 0010 0011 0012 0013

      - name: Bootstrap fresh database
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'fresh'
        run: supabase db push --linked --include-all --yes

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run

      - name: Apply pending migrations
        run: supabase db push --linked --yes
